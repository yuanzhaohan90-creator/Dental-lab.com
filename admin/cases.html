<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>案例管理 | YZH Dental Lab</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/site.css"><link rel="stylesheet" href="/assets/admin.css"></head>
<body class="admin-body">
<header class="admin-header"><div class="wrap"><a class="brand" href="/admin"><span class="brand-mark">Y</span><span>网站管理后台</span></a><strong>案例管理</strong><button class="btn btn-secondary admin-logout" id="logoutButton" type="button" hidden>退出登录</button></div></header>
<main class="admin-main wrap">
  <section class="admin-login" id="loginPanel"><form id="loginForm"><p class="eyebrow">管理员专用</p><h1>案例管理</h1><p>登录后管理草稿和已发布案例。</p><label class="field">管理员密码<input type="password" name="password" autocomplete="current-password" required></label><button class="btn btn-primary" type="submit">登录</button><div class="admin-message" id="loginMessage" role="status"></div></form></section>
  <section id="managerPanel" hidden>
    <nav class="admin-tabs case-admin-nav" aria-label="后台导航">
      <a href="/admin">后台首页</a>
      <a class="active" href="/admin/cases">案例管理</a>
      <a href="/admin/submissions">客户提交</a>
      <a href="/admin/media">媒体库</a>
      <a href="/admin/home">网站首页</a>
      <a href="/admin/settings">网站设置</a>
    </nav>
    <div class="admin-toolbar"><div><p class="eyebrow">公开案例库</p><h1>案例管理</h1></div><div class="admin-create-actions"><button class="btn btn-primary" id="addQuickWorkButton" type="button">添加快速作品</button><button class="btn btn-secondary" id="addCaseStudyButton" type="button">创建重点案例研究</button></div></div>
    <div class="admin-layout"><aside class="admin-case-list" id="adminCaseList"></aside>
      <form class="admin-editor" id="caseEditor" hidden>
        <div class="admin-editor-head"><div><p class="eyebrow" id="editorMode">添加案例</p><h2 id="editorTitle">新案例</h2></div><button class="icon-command" id="closeEditor" type="button" aria-label="关闭编辑器">×</button></div>
        <div class="admin-status-row"><label>内容类型<select name="contentType"><option value="quick_work">快速作品 / 图片展示</option><option value="case_study">重点案例研究</option></select></label><label>状态<select name="status"><option value="draft">草稿</option><option value="published">已发布</option></select></label><label class="check-field"><input type="checkbox" name="featured"> 显示在首页（最多 3 个）</label></div>
        <button class="btn btn-secondary upgrade-case-button" id="upgradeCaseButton" type="button">升级为重点案例研究</button>
        <div class="form-grid"><label class="field">标题 *<input name="title" required maxlength="160"></label><label class="field">分类 *<select name="category" required></select></label></div>
        <label class="field">简短说明<textarea name="shortNote" maxlength="500" placeholder="可选：填写简短技术说明"></textarea></label>
        <div class="form-grid"><label class="field">修复类型<input name="restorationType"></label><label class="field">材料<input name="material"></label><label class="field">种植系统<input name="implantSystem"></label><label class="field">平台<input name="platform"></label><label class="field">色号<input name="shade"></label><label class="field">标签<input name="tags" placeholder="implant, zirconia, MUA"></label></div>
        <section class="case-study-fields" id="caseStudyFields" hidden><div class="case-study-fields-head"><div><h3>案例研究内容</h3><p>只填写这个案例确实具备的内容，不要求每项都填。</p></div></div><label class="field">案例概述<textarea name="caseOverview"></textarea></label><label class="field">难点<textarea name="challenge"></textarea></label><label class="field">收到的资料<textarea name="recordsReceived"></textarea></label><label class="field">技术审核<textarea name="technicalReview"></textarea></label><label class="field">CAD / 设计<textarea name="cadDesign"></textarea></label><label class="field">临时修复体<textarea name="provisional"></textarea></label><label class="field">支架 / Ti-base<textarea name="framework"></textarea></label><label class="field">最终修复体<textarea name="finalRestoration"></textarea></label><label class="field">质量检查（QC）<textarea name="qc"></textarea></label><label class="field">技术结果<textarea name="technicalOutcome"></textarea></label></section>
        <section class="admin-image-section"><h3>封面图片 *</h3><p>每个案例都必须有封面。上传新封面会替换当前封面。</p><div id="currentCover"></div><label class="upload-zone">选择封面图片<input type="file" name="coverImage" accept="image/jpeg,image/png,image/webp"></label><label class="field">封面说明<input name="coverCaption" maxlength="240"></label></section>
        <section class="admin-image-section"><h3>其他图片</h3><p id="imageLimitNote">快速作品支持 0–6 张其他图片，可用箭头调整展示顺序。</p><div class="admin-image-list" id="existingImages"></div><label class="upload-zone">添加多张图片<input type="file" name="galleryImages" accept="image/jpeg,image/png,image/webp" multiple></label><div class="admin-image-list" id="newImages"></div></section>
        <p class="admin-privacy-warning"><strong>隐私提醒：</strong>未经适当授权，不得发布患者姓名、出生日期、病历号、正脸、含身份信息的处方或其他可识别患者的信息。</p>
        <div class="admin-message" id="editorMessage" role="status"></div><div class="admin-actions"><button class="btn btn-primary" type="submit">保存案例</button><button class="btn btn-secondary" id="previewButton" type="button">预览</button><button class="btn btn-secondary" id="togglePublishButton" type="button">发布</button><button class="btn btn-secondary" id="duplicateCaseButton" type="button">复制案例</button><button class="btn btn-danger" id="deleteCaseButton" type="button">删除</button></div>
      </form>
    </div>
  </section>
</main><script src="/assets/admin-cases.js" defer></script></body></html>
