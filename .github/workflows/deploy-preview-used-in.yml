name: Deploy Used In fix to Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yzh-preview-used-in
  cancel-in-progress: false

env:
  TARGET_COMMIT: e6e737e1f50c80fc7e52e32b8488f885247778d7
  PREVIEW_WORKER: yzh-dental-lab-preview

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fixed candidate
        uses: actions/checkout@v4
        with:
          ref: e6e737e1f50c80fc7e52e32b8488f885247778d7
          fetch-depth: 1

      - name: Verify candidate and Preview-only configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(sed -n 's/^name = "\([^"]*\)"/\1/p' wrangler.toml | head -n 1)" = "$PREVIEW_WORKER"
          test "$(sed -n 's/^bucket_name = "\([^"]*\)"/\1/p' wrangler.toml | head -n 1)" = "yzh-dental-lab-media-preview"
          ! grep -q 'yzh-dental-lab-production\|yzh-dental-lab-media"' wrangler.toml
          test -f wrangler.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Preview candidate checks
        run: |
          npm run check
          npm run test:admin
          npm run test:admin-deletion
          npm run test:cloudflare-media

      - name: Deploy Preview Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.151.1 deploy --config wrangler.toml --message "Used In fix ${TARGET_COMMIT}"

