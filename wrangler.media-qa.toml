name = "yzh-dental-lab-media-stream-qa"
main = "_worker.js"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
STORAGE_BACKEND = "r2"
R2_BUCKET_NAME = "yzh-dental-lab-media-stream-qa"
SITE_URL = "https://yzh-dental-lab-media-stream-qa.yzh-dental-lab-site.workers.dev"

[assets]
directory = "./cloudflare-public"
binding = "ASSETS"
html_handling = "none"
run_worker_first = ["/admin", "/admin/*", "/api/*", "/cases/*", "/sitemap.xml", "/robots.txt", "/implant-restorations", "/full-arch-all-on-x", "/crown-bridge", "/digital-dentistry", "/surgical-guides", "/privacy", "/assets/site.js", "/assets/site.css", "/assets/cases.js", "/assets/admin.js"]

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "yzh-dental-lab-media-stream-qa"

[observability]
enabled = true
head_sampling_rate = 1
