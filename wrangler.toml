name = "yzh-dental-lab-preview"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat"]
main = "_worker.js"

[vars]
STORAGE_BACKEND = "r2"
R2_ENDPOINT = "https://1ce2d7630efa6c5c079bf1e6905af7f8.r2.cloudflarestorage.com"
R2_BUCKET_NAME = "yzh-dental-lab-media-preview"
SITE_URL = "https://yzh-dental-lab-preview.workers.dev"
CASE_NOTIFICATION_EMAIL = "yzhdentallab@gmail.com"
CASE_FROM_EMAIL = "cases@yzhdentallab.com"

[assets]
directory = "./cloudflare-public"
binding = "ASSETS"
run_worker_first = ["/admin", "/admin/*", "/api/*", "/cases/*"]
html_handling = "none"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "yzh-dental-lab-media-preview"
preview_bucket_name = "yzh-dental-lab-media-preview"
